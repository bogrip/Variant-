<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра у Блеф</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
        .card { max-width: 450px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h1, h2, h3 { text-align: center; color: #f0b90b; margin-top: 0; }
        label { display: block; margin-top: 10px; font-size: 13px; color: #aaa; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #333; background: #2b2b2b; color: #fff; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #f0b90b; }
        button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; border: none; background: #f0b90b; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-alt { background: #24a1de; color: #fff; }
        .screen { display: none; }
        .active { display: block; }
        ul { list-style: none; padding: 0; }
        li { background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 8px; font-size: 14px; }
        .option-btn { background: #2b2b2b; color: #fff; border: 1px solid #444; padding: 12px; margin-bottom: 8px; border-radius: 8px; text-align: left; width: 100%; font-size: 15px; cursor: pointer; }
        .option-btn:hover { border-color: #f0b90b; }
        .status-box { background: #252525; padding: 10px; border-radius: 8px; text-align: center; font-size: 14px; color: #ccc; margin-bottom: 12px; }
        .badge-correct { background: #00ff7f; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .res-item { background: #2a2a2a; padding: 10px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #555; }
        .res-correct { border-left-color: #00ff7f; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎭 Гра в Блеф</h1>

    <!-- ЕКРАН 1: Вхід у гру -->
    <div id="screen-login" class="screen active">
        <label>Твоє ім'я:</label>
        <input type="text" id="username" placeholder="Введіть ім'я">
        
        <button onclick="createGame()">Створити гру (Я Ведучий)</button>
        <hr style="border-color: #333; margin: 20px 0;">
        
        <label>Код кімнати (для гравців):</label>
        <input type="text" id="join-code" placeholder="Наприклад: 1234">
        <button class="btn-alt" onclick="joinGame()">Приєднатися як гравець</button>
    </div>

    <!-- ЕКРАН 2: Лобі (Очікування гравців) -->
    <div id="screen-lobby" class="screen">
        <div class="status-box">Код кімнати: <b id="room-id-display" style="color:#f0b90b; font-size: 18px;">-</b></div>
        <h3>Гравці у кімнаті (<span id="player-count">1</span>):</h3>
        <ul id="player-list"></ul>
        <button id="start-btn" onclick="startQuestionPhase()" disabled>Розпочати раунд</button>
        <p id="lobby-wait-msg" style="text-align: center; font-size: 12px; color: #888;">Потрібно мінімум 3 учасники (1 ведучий + 2 гравці)</p>
    </div>

    <!-- ЕКРАН 3: Ввід відповідей -->
    <div id="screen-input" class="screen">
        <div class="status-box" id="role-indicator">---</div>
        
        <div id="host-inputs" style="display: none;">
            <label>1. Ваша фейкова відповідь (щоб заплутати):</label>
            <input type="text" id="host-fake" placeholder="Вигаданий варіант">
            
            <label>2. ПРАВИЛЬНА відповідь:</label>
            <input type="text" id="host-real" placeholder="Справжня відповідь">
        </div>

        <div id="player-inputs" style="display: none;">
            <label>Ваша фейкова відповідь:</label>
            <input type="text" id="player-fake" placeholder="Вигадайте переконливий варіант">
        </div>

        <button id="submit-answers-btn" onclick="submitAnswers()">Надіслати відповідь</button>
        <div id="input-wait-msg" class="status-box" style="display:none; margin-top: 15px;">Відповідь прийнято! Чекаємо інших...</div>
    </div>

    <!-- ЕКРАН 4: Голосування -->
    <div id="screen-vote" class="screen">
        <h3>Оберіть правильний варіант:</h3>
        <div id="options-container"></div>
        <div id="vote-wait-msg" class="status-box" style="display:none;">Голос прийнято! Чекаємо підсумків...</div>
    </div>

    <!-- ЕКРАН 5: Результати -->
    <div id="screen-results" class="screen">
        <h2>Підсумки раунду</h2>
        <div id="results-container"></div>
        <button id="next-round-btn" onclick="resetForNextRound()" style="display: none;">Наступний раунд</button>
    </div>
</div>

<script>
    let peer = null;
    let connMap = {}; 
    let hostConn = null; 
    let isHost = false;
    let myName = "";
    let myId = "";
    let players = []; 

    let answersSubmitted = {}; 
    let votesSubmitted = {};   
    let currentOptions = [];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function createGame() {
        myName = document.getElementById('username').value.trim();
        if (!myName) return alert("Введіть ім'я!");
        
        isHost = true;
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        myId = "bluff-game-" + code;

        peer = new Peer(myId);
        peer.on('open', () => {
            document.getElementById('room-id-display').innerText = code;
            players.push({ id: myId, name: myName + " (Ведучий)" });
            updateLobbyUI();
            showScreen('screen-lobby');
            document.getElementById('start-btn').style.display = 'block';
        });

        peer.on('connection', conn => {
            conn.on('data', data => handleHostMessages(conn, data));
            conn.on('close', () => {
                players = players.filter(p => p.id !== conn.peer);
                delete connMap[conn.peer];
                updateLobbyUI();
                broadcastState({ type: 'LOBBY_UPDATE', players });
            });
        });
    }

    function joinGame() {
        myName = document.getElementById('username').value.trim();
        const code = document.getElementById('join-code').value.trim();
        if (!myName || !code) return alert("Введіть ім'я та код кімнати!");

        isHost = false;
        peer = new Peer();
        peer.on('open', id => {
            myId = id;
            hostConn = peer.connect("bluff-game-" + code);
            hostConn.on('open', () => {
                hostConn.send({ type: 'JOIN', name: myName });
                showScreen('screen-lobby');
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('room-id-display').innerText = code;
            });
            hostConn.on('data', handlePlayerMessages);
        });
    }

    // ЛОГІКА ВЕДУЧОГО (Host)
    function handleHostMessages(conn, data) {
        if (data.type === 'JOIN') {
            connMap[conn.peer] = conn;
            players.push({ id: conn.peer, name: data.name });
            updateLobbyUI();
            broadcastState({ type: 'LOBBY_UPDATE', players });
        }
        else if (data.type === 'SUBMIT_ANSWER') {
            answersSubmitted[conn.peer] = data.answers;
            checkAllAnswersSubmitted();
        }
        else if (data.type === 'VOTE') {
            votesSubmitted[conn.peer] = data.optionIndex;
            checkAllVotesSubmitted();
        }
    }

    function updateLobbyUI() {
        document.getElementById('player-count').innerText = players.length;
        const list = document.getElementById('player-list');
        list.innerHTML = players.map(p => `<li>${p.name}</li>`).join('');
        if (isHost) {
            // Для старту потрібно мінімум 3 особи (1 ведучий + 2 гравці)
            document.getElementById('start-btn').disabled = players.length < 3; 
        }
    }

    function broadcastState(msg) {
        Object.values(connMap).forEach(c => c.send(msg));
    }

    // ЛОГІКА ГРАВЦІВ (Client)
    function handlePlayerMessages(data) {
        if (data.type === 'LOBBY_UPDATE') {
            players = data.players;
            updateLobbyUI();
        }
        else if (data.type === 'START_INPUT') {
            showInputScreen();
        }
        else if (data.type === 'START_VOTE') {
            currentOptions = data.options;
            showVoteScreen();
        }
        else if (data.type === 'SHOW_RESULTS') {
            showResultsScreen(data.results);
        }
    }

    // ЕТАП 1: Ввід відповідей
    function startQuestionPhase() {
        broadcastState({ type: 'START_INPUT' });
        showInputScreen();
    }

    function showInputScreen() {
        showScreen('screen-input');
        answersSubmitted = {};
        document.getElementById('submit-answers-btn').style.display = 'block';
        document.getElementById('input-wait-msg').style.display = 'none';

        if (isHost) {
            document.getElementById('role-indicator').innerText = "Ви — ВЕДУЧИЙ. Введіть 2 варіанти.";
            document.getElementById('host-inputs').style.display = 'block';
            document.getElementById('player-inputs').style.display = 'none';
        } else {
            document.getElementById('role-indicator').innerText = "Ви — ГРАВЕЦЬ. Вигадайте 1 варіант.";
            document.getElementById('host-inputs').style.display = 'none';
            document.getElementById('player-inputs').style.display = 'block';
        }
    }

    function submitAnswers() {
        let dataToSend = {};
        if (isHost) {
            const fake = document.getElementById('host-fake').value.trim();
            const real = document.getElementById('host-real').value.trim();
            if (!fake || !real) return alert("Заповніть обидва поля!");
            dataToSend = { fake, real };
            answersSubmitted[myId] = dataToSend;
        } else {
            const fake = document.getElementById('player-fake').value.trim();
            if (!fake) return alert("Введіть варіант!");
            dataToSend = { fake };
            hostConn.send({ type: 'SUBMIT_ANSWER', answers: dataToSend });
        }

        document.getElementById('submit-answers-btn').style.display = 'none';
        document.getElementById('input-wait-msg').style.display = 'block';

        if (isHost) checkAllAnswersSubmitted();
    }

    function checkAllAnswersSubmitted() {
        if (Object.keys(answersSubmitted).length === players.length) {
            currentOptions = [];
            players.forEach(p => {
                const ans = answersSubmitted[p.id];
                if (ans.real) {
                    currentOptions.push({ text: ans.real, isCorrect: true, authorId: p.id, authorName: p.name });
                    currentOptions.push({ text: ans.fake, isCorrect: false, authorId: p.id, authorName: p.name });
                } else {
                    currentOptions.push({ text: ans.fake, isCorrect: false, authorId: p.id, authorName: p.name });
                }
            });

            // Перемішуємо всі варіанти
            currentOptions.sort(() => Math.random() - 0.5);

            broadcastState({ type: 'START_VOTE', options: currentOptions });
            showVoteScreen();
        }
    }

    // ЕТАП 2: Голосування
    function showVoteScreen() {
        showScreen('screen-vote');
        votesSubmitted = {};
        document.getElementById('vote-wait-msg').style.display = 'none';

        const container = document.getElementById('options-container');
        container.innerHTML = "";

        if (isHost) {
            container.innerHTML = "<p style='text-align:center;'>Ведучий не голосує. Чекаємо вибору всіх гравців...</p>";
        } else {
            currentOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => submitVote(idx);
                container.appendChild(btn);
            });
        }
    }

    function submitVote(idx) {
        document.getElementById('options-container').innerHTML = "";
        document.getElementById('vote-wait-msg').style.display = 'block';

        if (!isHost) {
            hostConn.send({ type: 'VOTE', optionIndex: idx });
        }
    }

    function checkAllVotesSubmitted() {
        // Чекаємо голоси від усіх гравців, окрім ведучого
        if (Object.keys(votesSubmitted).length === players.length - 1) {
            const results = currentOptions.map((opt, idx) => {
                const voters = Object.entries(votesSubmitted)
                    .filter(([pId, vIdx]) => vIdx === idx)
                    .map(([pId]) => players.find(p => p.id === pId)?.name || "Гравець");

                return { ...opt, voters };
            });

            broadcastState({ type: 'SHOW_RESULTS', results });
            showResultsScreen(results);
        }
    }

    // ЕТАП 3: Результати
    function showResultsScreen(results) {
        showScreen('screen-results');
        const container = document.getElementById('results-container');
        container.innerHTML = "";

        results.forEach(res => {
            const div = document.createElement('div');
            div.className = `res-item ${res.isCorrect ? 'res-correct' : ''}`;
            
            let badge = res.isCorrect 
                ? `<span class="badge-correct">ПРАВИЛЬНА ВІДПОВІДЬ</span>` 
                : `<span style="color:#aaa;">Автор: ${res.authorName}</span>`;

            let votersText = res.voters.length > 0 
                ? `<br><small style="color:#f0b90b;">Проголосували: ${res.voters.join(', ')}</small>` 
                : '';

            div.innerHTML = `<b>${res.text}</b> <br> ${badge} ${votersText}`;
            container.appendChild(div);
        });

        if (isHost) {
            document.getElementById('next-round-btn').style.display = 'block';
        }
    }

    function resetForNextRound() {
        startQuestionPhase();
    }
</script>
</body>
</html>
